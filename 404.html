<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Page introuvable — WeurFarme</title>
  <style>
    :root { --vert: #2E7D32; --vert-fonce: #1B5E20; --vert-pale: #E8F5E9; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--vert-pale); color: #1b3a1e;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 1.5rem; text-align: center;
    }
    .carte {
      background: #fff; border-radius: 20px; padding: 3rem 2rem; max-width: 480px;
      box-shadow: 0 12px 40px rgba(27, 94, 32, .15);
    }
    .emoji { font-size: 4rem; }
    h1 { font-size: 2rem; color: var(--vert-fonce); margin: .5rem 0; }
    p { color: #4a5a4c; line-height: 1.6; margin-bottom: 1.5rem; }
    a {
      display: inline-block; background: var(--vert); color: #fff; text-decoration: none;
      padding: .8rem 1.6rem; border-radius: 10px; font-weight: 700;
      transition: background .2s;
    }
    a:hover { background: var(--vert-fonce); }
  </style>
</head>
<body>
  <main class="carte">
    <div class="emoji">🌾</div>
    <h1>Page introuvable</h1>
    <p>Cette page a été récoltée ou n'existe pas. Revenez à l'accueil pour retrouver vos fiches agricoles.</p>
    <a href="/">Retour à l'accueil</a>
  </main>
</body>
</html>
